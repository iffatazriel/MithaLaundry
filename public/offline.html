<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00488d" />
    <title>Mitha Laundry Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f9fb;
        color: #191c1e;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid #e0e3e5;
        border-radius: 16px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      .icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #d6e3ff;
        color: #00488d;
        font-weight: 800;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      p {
        margin: 0;
        color: #536772;
        line-height: 1.6;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">ML</div>
      <h1>Mitha Laundry sedang offline</h1>
      <p>
        Koneksi internet tidak tersedia. Beberapa halaman yang sudah pernah dibuka
        masih bisa tampil dari cache, lalu data akan tersinkron saat online kembali.
      </p>
    </main>
  </body>
</html>
