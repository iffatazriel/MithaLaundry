version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mitha-laundry-db
    environment:
      POSTGRES_USER: ${DB_USER:-laundry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laundry123}
      POSTGRES_DB: ${DB_NAME:-mitha_laundry}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-laundry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitha-laundry-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-laundry}:${DB_PASSWORD:-laundry123}@postgres:5432/${DB_NAME:-mitha_laundry}?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-your-secret-key-change-in-production}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
